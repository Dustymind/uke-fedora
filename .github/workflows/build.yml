name: Build Baseline Bootable Image

on:
  push:
    branches: [main, fix/focus-keyboard]
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma-separated profiles to build (e.g. tty, kde)'
        required: true
        default: 'kde'
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Record component pins
        run: |
          mkdir -p pins
          git -C senemos-uke-kernel rev-parse HEAD > pins/kernel.txt
          git -C uke-fedora-builder rev-parse HEAD > pins/builder.txt

      - name: Fetch upstream touch core
        run: |
          cd senemos-uke-kernel && git fetch upstream touch-core --tags 2>/dev/null || true

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/pip
          key: ${{ runner.os }}-build-${{ hashFiles('**/lockfiles/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h

      - name: Install host tools (base)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison ccache cpio device-tree-compiler flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            kmod libncurses5-dev libssl-dev lz4 lzop \
            m4 python3-pyelftools python3-pytest python3-zstandard \
            rpm2cpio rsync u-boot-tools unzip xz-utils zstd \
            git build-essential

      - name: Build mkbootimg and unpack_bootimg from source
        run: |
          cd /tmp
          git clone --depth 1 --branch 2022.11.09 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          # Remove -Werror from both Makefiles
          sed -i 's/-Werror//g' Makefile
          sed -i 's/-Werror//g' libmincrypt/Makefile
          make CFLAGS="-ffunction-sections -O3" -j$(nproc)
          # Build unpack_bootimg from libmincrypt
          make -C libmincrypt CFLAGS="-ffunction-sections -O3" unpackbootimg
          sudo cp mkbootimg /usr/local/bin/
          sudo cp libmincrypt/unpackbootimg /usr/local/bin/unpack_bootimg

      - name: Build abootimg from source
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/ntnem/abootimg.git
          cd abootimg
          make -j$(nproc)
          sudo cp abootimg /usr/local/bin/

      - name: Install remaining host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libncurses5-dev libssl-dev lz4 lzop \
            m4 python3-pyelftools python3-pytest python3-zstandard \
            rpm2cpio rsync u-boot-tools unzip xz-utils zstd

      - name: Patch builder and configure build environment
        run: |
          cd uke-fedora-builder
          git apply ../senemos-uke-kernel/patches/builder/*.patch 2>/dev/null || true

      - name: Build baseline image
        env:
          PROFILES: ${{ github.event.inputs.profiles || 'tty' }}
        run: |
          cd uke-fedora-builder
          ./build-images.sh "${PROFILES}"

      - name: Save build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/pip
          key: ${{ runner.os }}-build-${{ hashFiles('**/lockfiles/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Package release archives
        if: success()
        run: |
          cd uke-fedora-builder
          ./package-artifacts.sh

      - name: Upload bootable image artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-boot-${{ github.run_id }}
          path: uke-fedora-builder/out/*.img
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Profiles: ${{ github.event.inputs.profiles || 'tty' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

